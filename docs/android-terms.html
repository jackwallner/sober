<h1>Sober for Android Terms of Use</h1><p class="date">Last updated: October 10, 2026</p>
<h2>Agreement</h2><p>By using Sober on Android, you agree to these Terms of Use and to the <a href="https://play.google.com/about/play-terms/">Google Play Terms of Service</a>.</p>
<h2>Not medical advice</h2><p>Sober is a personal tracking tool. Health milestones are general wellness information with sources, not medical advice, diagnosis, or treatment. If you are concerned about your drinking or about stopping, talk to a healthcare professional. In the US, free and confidential help is available from the SAMHSA National Helpline at 1-800-662-4357.</p>
<h2>Bloom+ purchases</h2><p>Bloom+ includes monthly and yearly auto-renewing subscriptions and a one-time lifetime purchase. Prices, billing periods, and any free trial are shown in the app before you buy. Google Play charges your Google account when you confirm. A free trial converts to a paid subscription at its end unless you cancel before then. Subscriptions renew automatically until canceled. Manage or cancel any time in the Google Play Store under Payments &amp; subscriptions; cancellation takes effect at the end of the current billing period. Refunds are handled under Google Play's refund policies. Restore eligible purchases in the app with Restore Purchases.</p>
<h2>Your content</h2><p>What you record stays on your device. You are responsible for keeping your phone and its backups secure.</p>
<h2>Changes</h2><p>We may update these terms when the app changes. Continued use after an update means you accept the revised terms.</p>
